[package]
name = "portfu"
version = "2.0.0"
edition = "2024"

[features]
default = ["full"]
full = [
    "client",
    "cors",
    "endpoint",
    "files",
    "metrics",
    "oauth",
    "rate-limit",
    "sessions",
    "tasks",
    "tls",
    "websocket",
]
client = [
    "dep:rustls",
    "dep:tokio-tungstenite",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "hyper/client",
    "portfu_common/client",
    "portfu_common/websocket",
    "portfu_macros/client",
]
cors = ["portfu_common/cors"]
endpoint = ["portfu_macros/endpoint"]
files = ["portfu_common/files", "portfu_macros/files"]
metrics = ["portfu_common/metrics"]
oauth = ["portfu_common/oauth"]
rate-limit = ["portfu_common/rate-limit"]
sessions = ["portfu_common/sessions"]
tasks = ["portfu_common/tasks", "portfu_macros/tasks"]
tls = ["dep:rustls", "dep:tokio-rustls", "portfu_common/tls"]
websocket = ["dep:tokio-tungstenite", "portfu_common/websocket", "portfu_macros/websocket"]

[dependencies]
http = "1.4.0"
http-body = "1.0.1"
http-body-util = { version = "0.1.3"}
futures-util = "0.3.31"
inventory = "0.3.21"
hyper = {version = "1.8.1", features = ["server", "http1", "http2"] }
portfu_common = {path="../portfu_common", default-features = false}
portfu_macros = {path="../portfu_macros", default-features = false}
tokio = {version = "1.47.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
regex = "1.12.3"
hyper-util = {version = "0.1.20", features = ["tokio"]}
tokio-tungstenite = { version = "0.28.0", optional = true }
rustls = { version = "0.23.20", optional = true }
tokio-rustls = { version = "0.26.1", optional = true }
webpki-roots = { version = "1.0.6", optional = true }
log = "0.4.29"
