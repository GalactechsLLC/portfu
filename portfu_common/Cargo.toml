[package]
name = "portfu_common"
version = "2.0.0"
edition = "2024"

[dependencies]
http = "1.4.0"
http-body = "1.0.1"
http-body-util = { version = "0.1.3"}
hyper = {version = "1.8.1", features = ["server", "http1", "http2"] }
hyper-util = {version = "0.1.20", features = ["tokio"]}
inventory = "0.3.21"
regex = "1.12.3"
urlencoding = "2.1.3"
once_cell = "1.21.3"
tokio = {version = "1.47.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
uuid = { version = "1.21.0", features = ["v4"] }
log = "0.4.28"
