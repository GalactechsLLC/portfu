[package]
name = "portfu_common"
version = "2.0.0"
edition = "2024"

[dependencies]
cookie = "0.18.1"
dashmap = "6.1.0"
hex = "0.4.3"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = { version = "0.1.3"}
futures-util = "0.3.31"
hyper = {version = "1.8.1", features = ["server", "http1", "http2"] }
hyper-util = {version = "0.1.20", features = ["tokio"]}
inventory = "0.3.21"
regex = "1.12.3"
urlencoding = "2.1.3"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
sha2 = { version = "0.10.8", features = ["oid"] }
oauth2 = { version = "4.4.2", features = ["rustls-tls"] }
tokio = {version = "1.47.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-tungstenite = "0.28.0"
uuid = { version = "1.21.0", features = ["v4"] }
log = "0.4.28"
rcgen = "0.13.2"
rsa = { version = "0.9.10", features = ["std", "pem", "sha2"] }
rustls = "0.23.20"
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.1"
x509-cert = { version = "0.2.5", features = ["std", "pem", "builder"] }
