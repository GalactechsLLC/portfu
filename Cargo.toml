[workspace]
resolver = "2"

members = [
    "portfu_runtime",
    "portfu_admin",
    "portfu",
    "portfu_core",
    "portfu_macros",
    "portfu_operator"
]

[workspace.dependencies]
async-trait = "0.1.89"
cookie = "0.18.1"
dashmap = "6.1.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = { version = "0.1.3"}
hyper = {version="1.7.0", features=["full"]}
hyper-util = {version="0.1.16", features=["full"]}
jsonwebtoken = "9.3.1"
log = "0.4.28"
mime_guess = "2.0.5"
notify = "8.2.0"
once_cell = "1.21.3"
portfu = {path = "./portfu", version = "1.3.3", default-features = false}
portfu_admin = {path = "./portfu_admin", version = "1.3.3", default-features = false}
portfu_core = {path = "./portfu_core", version = "1.3.3", default-features = false}
portfu_macros = {path = "./portfu_macros", version = "1.3.3", default-features = false}
portfu_operator = {path = "./portfu_operator", version = "1.3.3", default-features = false}
portfu_operator_lib = {path = "./portfu_operator", version = "1.3.3", default-features = false}
portfu_runtime = {path = "./portfu_runtime", version = "1.3.3", default-features = false}
portfu_runtime_lib = {path = "./portfu_runtime", version = "1.3.3", default-features = false}
prometheus = "0.14.0"
proc-macro2 = "1.0.101"
quote = "1.0.40"
rand = "0.9.2"
regex = "1.11.2"
reqwest = {version="0.12.23", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = {version = "0.23.29" }
rustls-pemfile = "2.1.2"
rsa = { version = "0.9.6", features = ["std", "pem", "sha2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_html_form = "0.2.7"
serde_json = "1.0.143"
sha2 = "0.10.8"
simple_logger = "5.0.0"
struct-field-names-as-array = "0.3.0"
syn = { version="2.0.106", features = ["extra-traits"]}
time = { version = "0.3.43", features = ["serde-well-known"] }
tokio = {version = "1.47.1", features=["rt-multi-thread", "sync", "signal", "macros", "process", "time", "fs", "net"]}
tokio-rustls = { version = "0.26.2" }
tokio-tungstenite = {version = "0.26.2", features = ["rustls", "rustls-tls-webpki-roots"] }
tokio-util = "0.7.16"
url = "2.5.7"
uuid = {version = "1.18.1", features = ["v4", "serde"]}
x509-cert = { version = "0.2.5", features = ["std", "pem", "builder"] }
webpki-roots = "0.26.1"